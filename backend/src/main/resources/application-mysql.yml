spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/group_dashboard?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

dashboard:
  database:
    enabled: true
    import-on-startup: false
